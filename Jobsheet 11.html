<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Tutorial jQuery-Najjwa corner</title>
        <script src="js/jquery11.js"></script>
        <style>
            body{
                font-size: 17px;
                font-family: Arial;
            }
            .header{
                text-align: center;
                padding: 20px;
                background: rgb(120, 214, 89);
                color: rgb(68,68,68);
            }

            .container{
                padding: 50px;
            }
        </style>

        

    </head>
    <body>
        <div class="header">
            <h1>TUTORIAL JQUERY NAJJWA</h1>
        </div>

        <div class="container">
            <h1>Mouse Event</h1>
            <button id="tombol">Hilang</button>
            <button id="tombol2">Muncul</button>

            <br><br>
            <img id="gbr1" src="image/cutecat.jpg" width="250"/>
        </div>
        
        
        <script type="text/javascript">
            $(document).ready(function(){

               // $('#tombol').click(function(){
                //    alert("Haloo");
                //})

                /* $('#tombol').on('click', function(){
                    $('#gbr1').toggle();
                })

                $('#tombol2').click, (function(){
                    $('#gbr1').show();
                })

                $('#tombol').hover (function(){
                    $('#gbr1').css('width','50px');
                })
 */


                $('img').on('mouseenter', function(){
                    $('#gbr1').attr('src','image/images(1).jpg');
                })
                $('img').on('mouseleave', function(){
                    $('#gbr1').attr('src','image/cutecat.jpg');
                })

                $('#tombol').on('click', function(){
                    $('#gbr1').hide();
                })

                $('#tombol2').on('click', function(){
                    $('#gbr1').attr('src','image/cat.gif');
                    $('#gbr1').show();
                })
                /* $('#tombol2').on('mouseleave', function(){
                    $('#gbr1').attr('src','image/cutecat.jpg');
                }) */
            })


            
        </script>   

                
    </body>
</html>
